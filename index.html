<script>
'use strict';

const DB_NAME='SOMPORN_CLEAN_V2_DB';
const DB_VERSION=1;
let db=null,currentOrgId=null,mode='view',showLabels=false;
let layers=[],buildings=[],surveys=[],parcelLeaflets=[],searchIndex=[];
let activeModal=null;
let cloudClient=null, cloudReady=false, cloudBusy=false, cloudTimer=null;
const FIXED_SUPABASE_URL='https://xfplhehhpnfpwplopdrl.supabase.co';
const FIXED_SUPABASE_KEY='sb_publishable_EmeY1Z-YpDmgBwBbRZB8gA_t0ginTSi';

function cloudMsg(t,ok=false){
  const e=document.getElementById('cloudState');
  if(!e)return;
  e.textContent=t;
  e.style.background=ok?'#e8fff1':'#fff7e6';
  e.style.color=ok?'#0b6b37':'#8a5a00';
}
function initCloud(){
  if(!window.supabase){
    cloudClient=null;cloudReady=false;
    cloudMsg('❌ โหลดระบบ Cloud ไม่สำเร็จ');
    return false;
  }
  try{
    cloudClient=window.supabase.createClient(FIXED_SUPABASE_URL,FIXED_SUPABASE_KEY,{auth:{persistSession:false}});
    cloudReady=true;
    cloudMsg('✅ ข้อมูลกลางเชื่อมต่อแล้ว',true);
    return true;
  }catch(e){
    cloudClient=null;cloudReady=false;
    cloudMsg('❌ เชื่อมต่อข้อมูลกลางไม่สำเร็จ');
    return false;
  }
}


const TYPE_MAP={
 '1':'บ้านเดี่ยว','2':'บ้านแถว (ทาวน์เฮาส์)','3':'ห้องแถว','4':'ตึกแถว','5':'คลังสินค้าไม่เกิน 300 ตร.ม.',
 '6':'คลังสินค้าเกิน 300 ตร.ม.','7':'โรงจอดรถ','8':'สถานศึกษา','9':'โรงแรมไม่เกิน 5 ชั้น','10':'โรงแรมเกิน 5 ชั้น',
 '11':'โรงมหรสพ','12':'สถานพยาบาล','13':'สำนักงานไม่เกิน 5 ชั้น','14':'สำนักงานเกิน 5 ชั้น','15':'ภัตตาคาร',
 '16':'ห้างสรรพสินค้า','17':'อาคารพาณิชยกรรม','18':'สถานีบริการน้ำมัน','19':'โรงงาน','20':'ตลาดไม่เกิน 1,000 ตร.ม.',
 '21':'ตลาดเกิน 1,000 ตร.ม.','22':'โฮมออฟฟิศ','23':'โรงงานซ่อมรถยนต์','24':'อาคารจอดรถ',
 '25':'อาคารอยู่อาศัยรวมไม่เกิน 5 ชั้น','26':'อาคารอยู่อาศัยรวมเกิน 5 ชั้น','27':'โชว์รูมรถยนต์',
 '28':'ห้องน้ำรวม','29':'สระว่ายน้ำ','30':'ลานกีฬาอเนกประสงค์','31':'ลานคอนกรีต','32':'ท่าเทียบเรือ',
 '33':'โรงเลี้ยงสัตว์','34':'พื้นที่ตั้งป้ายโฆษณา','35':'รั้วคอนกรีต','36':'รั้วลวดถัก'
};
const MAT_MAP={'1':'ตึก','2':'ไม้','3':'ครึ่งตึกครึ่งไม้'};
const USE_MAP={'1':'เกษตรกรรม','2':'ที่อยู่อาศัย','3':'อื่น ๆ','4':'ทิ้งไว้ว่างเปล่า / รกร้าง'};

function status(msg){document.getElementById('status').textContent=msg}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open(DB_NAME,DB_VERSION);
 r.onupgradeneeded=()=>{const d=r.result;
   d.createObjectStore('orgs',{keyPath:'id'});
   const l=d.createObjectStore('layers',{keyPath:'id'});l.createIndex('orgId','orgId');
   const b=d.createObjectStore('buildings',{keyPath:'id'});b.createIndex('orgId','orgId');
   const s=d.createObjectStore('surveys',{keyPath:'id'});s.createIndex('orgId','orgId');
 };
 r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error);
})}
function st(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
async function put(name,obj){return reqP(st(name,'readwrite').put(obj))}
async function del(name,id){return reqP(st(name,'readwrite').delete(id))}
async function all(name){return reqP(st(name).getAll())}
async function byOrg(name,id){return reqP(st(name).index('orgId').getAll(id))}

async function clearStore(name){return reqP(st(name,'readwrite').clear())}


const map=L.map('map',{zoomControl:true}).setView([13.75,100.5],7);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,attribution:'Tiles © Esri'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,attribution:'© OpenStreetMap'});
L.control.layers({'ดาวเทียม':sat,'ถนน':osm}).addTo(map);
const drawn=L.layerGroup().addTo(map);

function normalizeCode(v){return String(v??'').trim().replace(/\s+/g,'')}
function parcelCode(f){const p=f?.properties||{};return p.parcel_cod||p.parcel_code||p.PARCEL_COD||p.parcel_no||p.id||''}
function closeModal(){document.getElementById('modal').classList.remove('open');activeModal=null}
function openModal(title,body,onSave,onDelete=null){
 document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;
 activeModal={onSave,onDelete};document.getElementById('modalDelete').style.display=onDelete?'inline-block':'none';
 document.getElementById('modal').classList.add('open');
}
function field(label,id,val='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`}
function sel(label,id,mapObj,val=''){
 return `<div class="field"><label>${label}</label><select id="${id}"><option value="">-- เลือก --</option>`+
 Object.entries(mapObj).map(([k,n])=>`<option value="${k}" ${String(val)===k?'selected':''}>${esc(n)}</option>`).join('')+'</select></div>';
}


async function pushCloud(){
  if(!cloudReady || cloudBusy)return;
  cloudBusy=true;
  try{
    const orgs=await all('orgs');
    const ls=await all('layers');
    const bs=await all('buildings');
    const ss=await all('surveys');

    const payload={
      id:'shared',
      updated_at:new Date().toISOString(),
      data:{orgs,layers:ls,buildings:bs,surveys:ss}
    };
    const {error}=await cloudClient.from('somporn_shared_state').upsert(payload,{onConflict:'id'});
    if(error)throw error;
    cloudMsg(`✅ ส่งข้อมูลขึ้นกลางแล้ว · แปลง ${ls.reduce((n,x)=>n+(x.geo?.features?.length||0),0).toLocaleString('th-TH')} · สิ่งปลูกสร้าง ${bs.length} · สำรวจ ${ss.length}`,true);
  }catch(e){
    cloudMsg('❌ ส่งข้อมูลขึ้นกลางไม่สำเร็จ: '+(e.message||e));
  }finally{cloudBusy=false}
}

async function pullCloud(silent=false){
  if(!cloudReady || cloudBusy)return;
  cloudBusy=true;
  try{
    const {data,error}=await cloudClient.from('somporn_shared_state').select('data,updated_at').eq('id','shared').maybeSingle();
    if(error)throw error;
    if(!data?.data){
      const localLayers=await all('layers');
      const localBuild=await all('buildings');
      const localSurvey=await all('surveys');
      if(localLayers.length || localBuild.length || localSurvey.length){
        cloudBusy=false;
        await pushCloud();
        cloudMsg('✅ สร้างข้อมูลกลางจากเครื่องนี้แล้ว',true);
        return;
      }
      if(!silent)cloudMsg('ยังไม่มีข้อมูลกลาง');
      return;
    }
    const p=data.data;
    await clearStore('orgs');await clearStore('layers');await clearStore('buildings');await clearStore('surveys');
    for(const x of p.orgs||[])await put('orgs',x);
    for(const x of p.layers||[])await put('layers',x);
    for(const x of p.buildings||[])await put('buildings',x);
    for(const x of p.surveys||[])await put('surveys',x);
    currentOrgId=null;
    await refreshOrgs();
    cloudMsg('✅ โหลดข้อมูลกลางล่าสุดแล้ว '+new Date(data.updated_at).toLocaleString('th-TH'),true);
  }catch(e){
    if(!silent)cloudMsg('❌ โหลดข้อมูลกลางไม่สำเร็จ: '+(e.message||e));
  }finally{cloudBusy=false}
}

function scheduleCloudPush(){
  if(!cloudReady)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>pushCloud(),900);
}

function parseKML(txt){
 const xml=new DOMParser().parseFromString(txt,'text/xml');const fs=[];
 xml.querySelectorAll('Placemark').forEach(pm=>{
   const name=pm.querySelector('name')?.textContent||'';
   let props={name};
   pm.querySelectorAll('ExtendedData Data').forEach(d=>props[d.getAttribute('name')]=d.querySelector('value')?.textContent||'');
   const poly=pm.querySelector('Polygon coordinates');
   const point=pm.querySelector('Point coordinates');
   if(poly){
     const c=poly.textContent.trim().split(/\s+/).map(x=>x.split(',').slice(0,2).map(Number)).filter(x=>x.every(Number.isFinite));
     if(c.length>=3)fs.push({type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:[c]}});
   }else if(point){
     const c=point.textContent.trim().split(',').slice(0,2).map(Number);
     if(c.every(Number.isFinite))fs.push({type:'Feature',properties:props,geometry:{type:'Point',coordinates:c}});
   }
 });
 return {type:'FeatureCollection',features:fs};
}
function normalizeGeo(obj){
 if(obj.type==='FeatureCollection')return obj;
 if(obj.type==='Feature')return {type:'FeatureCollection',features:[obj]};
 if(obj.type && obj.coordinates)return {type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:obj}]};
 throw new Error('รูปแบบ JSON/GeoJSON ไม่ถูกต้อง');
}
function pointInRing(lng,lat,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){
 const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
 const hit=((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi||1e-12)+xi);if(hit)inside=!inside;
}return inside}
function contains(f,ll){
 const g=f.geometry;if(!g)return false;
 if(g.type==='Polygon')return pointInRing(ll.lng,ll.lat,g.coordinates[0]);
 if(g.type==='MultiPolygon')return g.coordinates.some(p=>pointInRing(ll.lng,ll.lat,p[0]));
 return false;
}
function findParcel(ll){for(const r of layers)for(const f of r.geo.features)if(contains(f,ll))return f;return null}

function nextBuildCode(pc){
 let max=0;buildings.filter(b=>b.parcelCode===pc).forEach(b=>{const m=String(b.buildingCode||'').match(/-B(\d+)$/);if(m)max=Math.max(max,+m[1])});
 return pc+'-B'+String(max+1).padStart(3,'0');
}

function popupParcel(f,l){
 const p=f.properties||{},pc=normalizeCode(parcelCode(f))||'-';
 let center=null;try{center=l.getBounds().getCenter()}catch(e){}
 return `<b>รหัสแปลง: ${esc(pc)}</b><br>`+
 Object.entries(p).slice(0,8).map(([k,v])=>`${esc(k)}: ${esc(v)}<br>`).join('')+
 (center?`<div class="popup-actions"><button onclick="navTo(${center.lat},${center.lng})">🧭 นำทาง</button></div>`:'');
}
function popupBuild(b){
 return `<b>${esc(b.buildingCode)}</b><br>แปลง: ${esc(b.parcelCode)}<br>ประเภท: ${esc(TYPE_MAP[b.b_type]||'-')}<br>ลักษณะ: ${esc(MAT_MAP[b.b_chb]||'-')}<br>ใช้ประโยชน์: ${esc(USE_MAP[b.lu]||'-')}
 <div class="popup-actions"><button onclick="editBuild('${b.id}')">✏ แก้ไข</button><button onclick="removeBuild('${b.id}')">🗑 ลบ</button><button onclick="navBuild('${b.id}')">🧭 นำทาง</button></div>`;
}
window.navTo=(lat,lng)=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,'_blank');
window.navBuild=id=>{const b=buildings.find(x=>x.id===id);if(b)navTo(b.lat,b.lng)};
window.editBuild=id=>{const b=buildings.find(x=>x.id===id);if(b)openBuildEdit(b)};
window.removeBuild=async id=>{const b=buildings.find(x=>x.id===id);if(!b)return;if(confirm('ยืนยันลบ '+b.buildingCode+' ?')){await del('buildings',id);await reload();status('✅ ลบสิ่งปลูกสร้างแล้ว');scheduleCloudPush()}};

function render(){
 drawn.clearLayers();parcelLeaflets=[];searchIndex=[];
 for(const r of layers){
   for(const f of r.geo.features){
     if(!f.geometry)continue;
     if(['Polygon','MultiPolygon'].includes(f.geometry.type)){
       const l=L.geoJSON(f,{style:{color:'#ff6b00',weight:2,fillOpacity:.08}}).addTo(drawn);
       const inner=Object.values(l._layers)[0]||l;
       parcelLeaflets.push(inner);
       const pc=normalizeCode(parcelCode(f));
       if(pc)searchIndex.push({type:'parcel',key:pc,feature:f,leaflet:inner});
       inner.on('click',()=>{if(mode==='view')inner.bindPopup(popupParcel(f,inner)).openPopup()});
       if(showLabels&&pc){try{inner.bindTooltip(pc,{permanent:true,direction:'center',className:'parcel-label'})}catch(e){}}
     }
   }
 }
 for(const b of buildings){
   const m=L.circleMarker([b.lat,b.lng],{radius:6,color:'#0d6efd',weight:2,fillOpacity:.9}).addTo(drawn).bindPopup(popupBuild(b));
   searchIndex.push({type:'building',key:(b.buildingCode||'')+' '+(b.parcelCode||''),leaflet:m,record:b});
 }
 for(const s of surveys){
   L.circleMarker([s.lat,s.lng],{radius:5,color:'#198754',weight:2,fillOpacity:.9}).addTo(drawn).bindPopup(`<b>${esc(s.parcelCode)}</b><br>${esc(s.status)}<br>${esc(s.note||'')}`);
 }
 renderLayers();
}
function renderLayers(){const box=document.getElementById('layerList');box.innerHTML='';layers.forEach(r=>{const d=document.createElement('div');d.className='layer';d.textContent=`${r.name} · ${r.geo.features.length.toLocaleString('th-TH')} รายการ`;box.appendChild(d)})}
async function reload(){layers=await byOrg('layers',currentOrgId);buildings=await byOrg('buildings',currentOrgId);surveys=await byOrg('surveys',currentOrgId);render()}

async function refreshOrgs(){
 let os=await all('orgs');
 if(!os.length){const o={id:uuid(),name:'อปท. ตัวอย่าง'};await put('orgs',o);os=[o]}
 const s=document.getElementById('orgSelect');s.innerHTML='';
 os.sort((a,b)=>a.name.localeCompare(b.name,'th')).forEach(o=>s.add(new Option(o.name,o.id)));
 if(!currentOrgId||!os.some(o=>o.id===currentOrgId))currentOrgId=os[0].id;s.value=currentOrgId;await reload();
}

function openBuildAdd(ll,f){
 const pc=normalizeCode(parcelCode(f));if(!pc)return alert('แปลงนี้ไม่มีรหัสแปลง');
 const code=nextBuildCode(pc);
 const body=`<div class="codebox">แปลง: ${esc(pc)}<br>รหัสใหม่: ${esc(code)}</div>`+
 sel('ประเภทสิ่งปลูกสร้าง','bt',TYPE_MAP)+sel('ลักษณะสิ่งปลูกสร้าง','bm',MAT_MAP)+sel('การใช้ประโยชน์','bu',USE_MAP)+
 field('จำนวนห้อง','br','1','number')+field('กว้าง (ม.)','bw','', 'number')+field('ยาว (ม.)','bl','', 'number')+
 field('อายุอาคาร (ปี)','ba','', 'number')+field('ชื่อ','bn')+field('บ้านเลขที่','bad')+field('หมู่','bmoo')+
 `<div class="field"><label>หมายเหตุ</label><textarea id="bnote"></textarea></div>`;
 openModal('เพิ่มสิ่งปลูกสร้าง',body,async()=>{
   const b={id:uuid(),orgId:currentOrgId,parcelCode:pc,buildingCode:code,b_code:String(parseInt(code.match(/B(\d+)$/)[1],10)),
    b_type:document.getElementById('bt').value,b_chb:document.getElementById('bm').value,lu:document.getElementById('bu').value,
    b_room:document.getElementById('br').value,wide:document.getElementById('bw').value,long:document.getElementById('bl').value,
    b_age:document.getElementById('ba').value,name:document.getElementById('bn').value,b_address:document.getElementById('bad').value,

   await put('buildings',b);closeModal();await reload();status('✅ บันทึก '+code+' แล้ว');scheduleCloudPush();
 });
}
function openBuildEdit(b){
 const body=`<div class="codebox">${esc(b.buildingCode)} · แปลง ${esc(b.parcelCode)}</div>`+
 sel('ประเภทสิ่งปลูกสร้าง','bt',TYPE_MAP,b.b_type)+sel('ลักษณะสิ่งปลูกสร้าง','bm',MAT_MAP,b.b_chb)+sel('การใช้ประโยชน์','bu',USE_MAP,b.lu)+
 field('จำนวนห้อง','br',b.b_room||'1','number')+field('กว้าง (ม.)','bw',b.wide||'','number')+field('ยาว (ม.)','bl',b.long||'','number')+
 field('อายุอาคาร (ปี)','ba',b.b_age||'','number')+field('ชื่อ','bn',b.name||'')+field('บ้านเลขที่','bad',b.b_address||'')+field('หมู่','bmoo',b.b_moo||'')+
 `<div class="field"><label>หมายเหตุ</label><textarea id="bnote">${esc(b.note||'')}</textarea></div>`;
 openModal('แก้ไขสิ่งปลูกสร้าง',body,async()=>{
   Object.assign(b,{b_type:document.getElementById('bt').value,b_chb:document.getElementById('bm').value,lu:document.getElementById('bu').value,
   b_room:document.getElementById('br').value,wide:document.getElementById('bw').value,long:document.getElementById('bl').value,
   b_age:document.getElementById('ba').value,name:document.getElementById('bn').value,b_address:document.getElementById('bad').value,
   b_moo:document.getElementById('bmoo').value,note:document.getElementById('bnote').value,updatedAt:Date.now()});
   await put('buildings',b);closeModal();await reload();status('✅ แก้ไข '+b.buildingCode+' แล้ว');scheduleCloudPush();
 },async()=>{await del('buildings',b.id);closeModal();await reload();status('✅ ลบ '+b.buildingCode+' แล้ว');scheduleCloudPush()});
}

function openSurveyAdd(ll,f){
 const pc=normalizeCode(parcelCode(f));if(!pc)return alert('แปลงนี้ไม่มีรหัสแปลง');
 const body=`<div class="codebox">แปลง: ${esc(pc)}</div>`+
 `<div class="field"><label>สถานะ</label><select id="ss"><option>สำรวจแล้ว</option><option>ตรวจแล้ว</option><option>มีการแก้ไข</option><option>ต้องกลับไปตรวจ</option></select></div>`+
 `<div class="field"><label>หมายเหตุ</label><textarea id="sn"></textarea></div>`;
 openModal('บันทึกสถานะสำรวจ',body,async()=>{
  await put('surveys',{id:uuid(),orgId:currentOrgId,parcelCode:pc,lat:ll.lat,lng:ll.lng,status:document.getElementById('ss').value,note:document.getElementById('sn').value,updatedAt:Date.now()});
  closeModal();await reload();status('✅ บันทึกสถานะแปลง '+pc+' แล้ว');scheduleCloudPush();

function searchNow(){
 const q=normalizeCode(document.getElementById('search').value).toLowerCase();if(!q)return status('กรุณาพิมพ์รหัสที่ต้องการค้นหา');
 const h=searchIndex.find(x=>normalizeCode(x.key).toLowerCase().includes(q));if(!h)return alert('ไม่พบข้อมูล '+q);
 try{if(h.leaflet.getBounds)map.fitBounds(h.leaflet.getBounds(),{padding:[40,40],maxZoom:20});else map.setView(h.leaflet.getLatLng(),20)}catch(e){}
 h.leaflet.openPopup?.();status('✅ พบข้อมูล '+q);if(window.innerWidth<=760)setSideOpen(false);
}
function csvEsc(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function csv(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\n'),'text/csv;charset=utf-8')}
function stamp(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}

// --- Buttons ---
document.getElementById('modalCancel').onclick=closeModal;
document.getElementById('modalSave').onclick=async()=>{try{if(activeModal?.onSave)await activeModal.onSave()}catch(e){alert('บันทึกไม่สำเร็จ: '+e.message)}};
document.getElementById('modalDelete').onclick=async()=>{if(activeModal?.onDelete&&confirm('ยืนยันลบ?'))await activeModal.onDelete()};
document.getElementById('addOrg').onclick=async()=>{
 try{const n=document.getElementById('newOrgName').value.trim();if(!n)return alert('กรุณากรอกชื่อ อปท.');
 const o={id:uuid(),name:n};await put('orgs',o);currentOrgId=o.id;document.getElementById('newOrgName').value='';await refreshOrgs();status('✅ เพิ่ม อปท. '+n+' แล้ว');scheduleCloudPush()}catch(e){alert('เพิ่ม อปท. ไม่สำเร็จ: '+e.message)}
};
document.getElementById('orgSelect').onchange=async e=>{currentOrgId=e.target.value;await reload();status('✅ เปลี่ยน อปท. แล้ว');if(window.innerWidth<=760)setSideOpen(false)};
document.getElementById('mode').onchange=e=>{mode=e.target.value;status('โหมด: '+e.target.options[e.target.selectedIndex].text);if(window.innerWidth<=760)setSideOpen(false)};
document.getElementById('toggleLabels').onclick=()=>{showLabels=!showLabels;render();status(showLabels?'✅ แสดงรหัสแปลง':'✅ ซ่อนรหัสแปลง')};
document.getElementById('satBtn').onclick=()=>{if(map.hasLayer(osm))map.removeLayer(osm);if(!map.hasLayer(sat))sat.addTo(map);status('✅ แผนที่ดาวเทียม')};
document.getElementById('osmBtn').onclick=()=>{if(map.hasLayer(sat))map.removeLayer(sat);if(!map.hasLayer(osm))osm.addTo(map);status('✅ แผนที่ถนน')};
document.getElementById('gpsBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],19);status('✅ พบตำแหน่งปัจจุบัน')},e=>alert('ไม่สามารถอ่านตำแหน่งได้ กรุณาอนุญาต Location'));
document.getElementById('btnSearch').onclick=searchNow;
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')searchNow()};

function setSideOpen(open){
 const side=document.getElementById('side');
 const overlay=document.getElementById('sideOverlay');
 side.classList.toggle('open',open);
 overlay.classList.toggle('open',open);
 setTimeout(()=>{try{map.invalidateSize(false)}catch(e){}},220);
}
document.getElementById('topMobile').onclick=()=>setSideOpen(true);
document.getElementById('closeSide').onclick=()=>setSideOpen(false);
document.getElementById('sideOverlay').onclick=()=>setSideOpen(false);


document.getElementById('fileInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  if(!currentOrgId)throw new Error('ยังไม่มี อปท.');
  status('กำลังนำเข้า '+f.name+' ...');const txt=await f.text();let geo;
  if(f.name.toLowerCase().endsWith('.kml'))geo=parseKML(txt);else geo=normalizeGeo(JSON.parse(txt));
  if(!geo.features.length)throw new Error('ไฟล์ไม่มี Feature');
  await put('layers',{id:uuid(),orgId:currentOrgId,name:f.name,geo,createdAt:Date.now()});await reload();
  let bounds=null;parcelLeaflets.forEach(l=>{try{const b=l.getBounds();bounds=bounds?bounds.extend(b):b}catch(x){}});if(bounds?.isValid())map.fitBounds(bounds,{padding:[20,20]});
  const msg=`✅ นำเข้าเรียบร้อย: ${f.name} จำนวน ${geo.features.length.toLocaleString('th-TH')} รายการ`;status(msg);alert(msg);await pushCloud();if(window.innerWidth<=760)setSideOpen(false);
 }catch(err){const msg='❌ นำเข้าไม่สำเร็จ: '+err.message;status(msg);alert(msg)}
 e.target.value='';
};

document.getElementById('csvBuild').onclick=()=>{const rows=[['parcel_cod','building_code','b_code','b_type','b_chb','b_room','wide','long','lu','b_age','name','b_address','b_moo','note','latitude','longitude']];buildings.forEach(b=>rows.push([b.parcelCode,b.buildingCode,b.b_code,b.b_type,b.b_chb,b.b_room,b.wide,b.long,b.lu,b.b_age,b.name,b.b_address,b.b_moo,b.note,b.lat,b.lng]));csv('buildings_'+stamp()+'.csv',rows);status('✅ Export CSV สิ่งปลูกสร้างแล้ว')};
document.getElementById('csvSurvey').onclick=()=>{const rows=[['parcel_cod','status','note','latitude','longitude','updated_at']];surveys.forEach(s=>rows.push([s.parcelCode,s.status,s.note,s.lat,s.lng,new Date(s.updatedAt).toISOString()]));csv('surveys_'+stamp()+'.csv',rows);status('✅ Export CSV สำรวจแล้ว')};
document.getElementById('backup').onclick=async()=>{const pack={type:'SOMPORN_CLEAN_V2_BACKUP',at:new Date().toISOString(),orgs:await all('orgs'),layers:await all('layers'),buildings:await all('buildings'),surveys:await all('surveys')};download('SOMPORN_BACKUP_'+stamp()+'.json',JSON.stringify(pack,null,2),'application/json');status('✅ Backup ทั้งระบบแล้ว')};
document.getElementById('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.type!=='SOMPORN_CLEAN_V2_BACKUP')throw new Error('ไฟล์ Backup ไม่ตรงรุ่น');if(!confirm('กู้คืนข้อมูลทั้งหมด?'))return;
 for(const n of ['orgs','layers','buildings','surveys'])await reqP(st(n,'readwrite').clear());
 for(const x of p.orgs||[])await put('orgs',x);for(const x of p.layers||[])await put('layers',x);for(const x of p.buildings||[])await put('buildings',x);for(const x of p.surveys||[])await put('surveys',x);
 currentOrgId=null;await refreshOrgs();status('✅ Restore สำเร็จ');alert('✅ กู้คืนข้อมูลเรียบร้อย');scheduleCloudPush()}catch(err){alert('Restore ไม่สำเร็จ: '+err.message)}e.target.value=''};


document.getElementById('cloudSync').onclick=async()=>{
 if(!initCloud())return alert('กรุณาตั้งค่าข้อมูลกลางก่อน');
 await pullCloud(false);
};

document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && cloudReady) pullCloud(true);
});
window.addEventListener('focus',()=>{if(cloudReady)pullCloud(true)});
setInterval(()=>{if(cloudReady && document.visibilityState==='visible')pullCloud(true)},15000);

map.on('click',e=>{if(mode==='building-add'){const f=findParcel(e.latlng);if(!f)return alert('จุดนี้อยู่นอกแปลง');openBuildAdd(e.latlng,f)}else if(mode==='survey-add'){const f=findParcel(e.latlng);if(!f)return alert('จุดนี้อยู่นอกแปลง');openSurveyAdd(e.latlng,f)}});

(async()=>{
 try{
  await openDB();await refreshOrgs();status('✅ ระบบพร้อมใช้งาน');
  setTimeout(()=>map.invalidateSize(true),250);
  if(initCloud())await pullCloud(true);
 }catch(e){status('❌ เปิดฐานข้อมูลไม่สำเร็จ');alert('เปิดระบบไม่สำเร็จ: '+e.message)}
})();

document.addEventListener('keydown',e=>{if(e.key==='Escape')setSideOpen(false)});
window.addEventListener('resize',()=>{if(window.innerWidth>760)setSideOpen(false)});
